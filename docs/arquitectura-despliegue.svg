  .lbl{font-size:13px;fill:var(--ink2)}.lbl-a{font-size:13px;font-weight:600;fill:var(--accent)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .flow{stroke:var(--accent);stroke-width:2.2;fill:none}.sse{stroke:var(--ink2);stroke-width:1.8;stroke-dasharray:6 5;fill:none}
