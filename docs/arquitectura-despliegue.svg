  .bg{fill:var(--bg)}
  .node{fill:var(--node);stroke:var(--line);stroke-width:1.2}.vps{fill:var(--vps);stroke:var(--line);stroke-width:1.4}
  .stack{fill:var(--stack);stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}.ghost{stroke-dasharray:6 5;fill:none}
  .tile{fill:var(--tile);stroke:var(--line);stroke-width:1}.tt{font-weight:700;fill:#3a4452}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
