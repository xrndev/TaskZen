
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 330" width="1240" height="330" role="img" aria-label="Las imágenes se construyen en tu PC, se suben por SSH a la VPS y allí se aplican las migraciones antes de arrancar la aplicación."><style>
  :root{--ink:#111820;--ink2:#4a5565;--line:#c8d0d9;--vps:#e9eff4;--stack:#f6f9fb;--node:#fff;--tile:#fff;--accent:#0b7a85;--bg:#f3f5f7}
