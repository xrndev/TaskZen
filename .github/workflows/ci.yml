name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://taskzen:ci@localhost:5432/taskzen
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-0000

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskzen
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: taskzen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskzen" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
